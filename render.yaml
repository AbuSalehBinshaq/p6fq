services:
  - type: web
    runtime: node
    name: batal-story
    region: frankfurt
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:render
    startCommand: pnpm start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: ORDERS_DASHBOARD_PASSWORD
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_CLARITY_PROJECT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_URL
        value: https://batal-story.onrender.com/api/telegram/webhook
