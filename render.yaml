services:
  - type: web
    runtime: node
    name: batal-story
    region: frankfurt
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:render
    startCommand: pnpm start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: batal-story-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DISCORD_WEBHOOK_URL
        sync: false

databases:
  - name: batal-story-db
    databaseName: batal_story
    user: batal_story
    region: frankfurt
    plan: free
