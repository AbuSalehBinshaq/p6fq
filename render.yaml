services:
  - type: web
    runtime: node
    name: batal-story
    region: frankfurt
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build:render
    preDeployCommand: pnpm db:migrate:render
    startCommand: pnpm start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "false"
      - key: DISCORD_WEBHOOK_URL
        sync: false
